version: '3.8'

services:
  backend:
    build: .
    container_name: autopayment_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/autopayment
      - JWT_SECRET=super_secret_jwt_access_key_2026
      - JWT_REFRESH_SECRET=super_secret_jwt_refresh_key_2026
      - CORS_ORIGIN=*
    depends_on:
      - mongo
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs

  mongo:
    image: mongo:6.0
    container_name: autopayment_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
